# File: docker-compose.yml
version: '3.8'

services:
  client:
    build: ./client
    container_name: movieflix-client
    ports:
      - "80:80"
    depends_on:
      - server
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongo:27017/movieflix

    networks:
      - app-network

  server:
    build: ./server
    container_name: movieflix-server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: movieflix-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local